<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Hub – SPA Demo</title>
  <link rel="stylesheet" href="./styles.css?v=20251112" />
</head>
<body>
  <!-- no top bar; title lives inside sidebar -->

  <!-- Layout: sidebar + main -->
  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header" id="sidebarTitle">
        <span class="sidebar-brand">Content Hub</span>
        <button id="edgeToggle" class="edge-btn" aria-label="Toggle sidebar">❮</button>
      </div>
      <nav class="nav">
        <a href="#/welcome" class="nav-link">
          <svg width="12" height="12" viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:1.5;vertical-align:-2px;margin-right:6px"><path d="M3 10l9-7 9 7v9a1 1 0 0 1-1 1h-6v-6H10v6H4a1 1 0 0 1-1-1z"/></svg>
          <span class="label">Welcome</span>
        </a>
        <a href="#/seasonal-events" class="nav-link">
          <svg width="12" height="12" viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:1.5;vertical-align:-2px;margin-right:6px"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
          <span class="label">Seasonal Events</span>
        </a>
        <a href="#/ai-search" class="nav-link">
          <svg width="12" height="12" viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:1.5;vertical-align:-2px;margin-right:6px"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.35-4.35"/></svg>
          <span class="label">AISearch (AIO + AIM)</span>
        </a>
        <a href="#/articles" class="nav-link">
          <svg width="12" height="12" viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:1.5;vertical-align:-2px;margin-right:6px"><path d="M6 2h9l3 3v17H6z"/><path d="M15 2v5h5"/><path d="M8 11h8M8 15h8M8 19h8"/></svg>
          <span class="label">Articles</span>
        </a>
        <a href="#/funnel" class="nav-link">
          <svg width="12" height="12" viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:1.5;vertical-align:-2px;margin-right:6px"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>
          <span class="label">Funnel Optimisation</span>
        </a>
        <a href="#/vertical-profiles" class="nav-link">
          <svg width="12" height="12" viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:1.5;vertical-align:-2px;margin-right:6px"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>
          <span class="label">Vertical Profiles</span>
        </a>
        <a href="#/mc-ads" class="nav-link">
          <svg width="12" height="12" viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:1.5;vertical-align:-2px;margin-right:6px"><path d="M3 11l13-5v12l-13-5z"/><path d="M16 6v12"/><path d="M7 12v6"/></svg>
          <span class="label">MC ads, scripts, + brainstorming</span>
        </a>
        <div class="nav-link" style="opacity:.7; cursor:default;">
          <svg width="12" height="12" viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:1.5;vertical-align:-2px;margin-right:6px"><path d="M12 5v14M5 12h14"/></svg>
          <span class="label">+ More to come…</span>
        </div>
      </nav>
    </aside>

    <main id="app" class="main">
      <!-- Routed content will render here by app.js -->
    </main>
  </div>

  <!-- edge toggle now lives in sidebar header -->

  <!-- About modal -->
  <div id="aboutModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="aboutTitle" class="modal-title">About this Demo</h2>
        <button class="btn btn-ghost" data-close aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <p>This is a lightweight, framework-free SPA demo with a hash router, a sticky topbar, and a collapsible sidebar.</p>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js?v=20251110"></script>
  <noscript>Please enable JavaScript to use this app.</noscript>
</body>
</html>
