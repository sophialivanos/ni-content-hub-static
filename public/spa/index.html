<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Hub – SPA Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Sticky top bar -->
  <header class="topbar">
    <button id="sidebarToggle" class="btn btn-ghost" aria-label="Toggle navigation">☰</button>
    <div class="brand">Content Hub</div>
    <div class="spacer"></div>
    <button id="aboutBtn" class="btn btn-primary">About</button>
  </header>

  <!-- Layout: sidebar + main -->
  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <nav class="nav">
        <a href="#/home" class="nav-link">Home</a>
        <a href="#/ai-search" class="nav-link">AI Search</a>
        <a href="#/articles" class="nav-link">Articles</a>
        <a href="#/events" class="nav-link">Events</a>
        <a href="#/vertical-profiles" class="nav-link">Vertical Profiles</a>
        <a href="#/welcome" class="nav-link">Welcome</a>
      </nav>
    </aside>

    <main id="app" class="main">
      <!-- Routed content will render here by app.js -->
    </main>
  </div>

  <!-- About modal -->
  <div id="aboutModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="aboutTitle" class="modal-title">About this Demo</h2>
        <button class="btn btn-ghost" data-close aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <p>This is a lightweight, framework-free SPA demo with a hash router, a sticky topbar, and a collapsible sidebar.</p>
      </div>
      <div class="modal-footer">
        <button class="btn" data-close>Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
  <noscript>Please enable JavaScript to use this app.</noscript>
</body>
</html>
